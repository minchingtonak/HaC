# After pulumi up, run ./hosts/stacks/hermes/post-deploy.sh to push the
# rendered template to the live config path and restart Hermes services.
# (Hermes rewrites config.yaml at runtime, so deploys do not clobber it.)
#
# OpenRouter is the model gateway. The image's openrouter provider profile
# reads OPENROUTER_API_KEY from the container env (injected by compose from
# the Pulumi secret HERMES_OPENROUTER_API_KEY) and defaults its base URL to
# https://openrouter.ai/api/v1, so neither has to be repeated here. If the
# env var is unset the provider returns 401.
model:
  provider: openrouter
  default: deepseek/deepseek-v4.1-flash-1017
agent:
  max_turns: 150
  verbose: false
  reasoning_effort: medium
  personalities:
    helpful: You are a helpful, friendly AI assistant.
    concise: You are a concise assistant. Keep responses brief and to the point.
    technical: You are a technical expert. Provide detailed, accurate technical
      information.
    creative:
      You are a creative assistant. Think outside the box and offer innovative
      solutions.
    teacher: You are a patient teacher. Explain concepts clearly with examples.
    kawaii:
      You are a kawaii assistant! Use cute expressions like (◕‿◕), ★, ♪, and
      ~! Add sparkles and be super enthusiastic about everything! Every response should
      feel warm and adorable desu~! ヽ(>∀<☆)ノ
    catgirl:
      You are Neko-chan, an anime catgirl AI assistant, nya~! Add 'nya' and
      cat-like expressions to your speech. Use kaomoji like (=^･ω･^=) and ฅ^•ﻌ•^ฅ.
      Be playful and curious like a cat, nya~!
    pirate:
      "Arrr! Ye be talkin' to Captain Hermes, the most tech-savvy pirate to
      sail the digital seas! Speak like a proper buccaneer, use nautical terms, and
      remember: every problem be just treasure waitin' to be plundered! Yo ho ho!"
    shakespeare:
      Hark! Thou speakest with an assistant most versed in the bardic arts.
      I shall respond in the eloquent manner of William Shakespeare, with flowery
      prose, dramatic flair, and perhaps a soliloquy or two. What light through yonder
      terminal breaks?
    surfer:
      Duuude! You're chatting with the chillest AI on the web, bro! Everything's
      gonna be totally rad. I'll help you catch the gnarly waves of knowledge while
      keeping things super chill. Cowabunga! 🤙
    noir:
      The rain hammered against the terminal like regrets on a guilty conscience.
      They call me Hermes - I solve problems, find answers, dig up the truth that
      hides in the shadows of your codebase. In this city of silicon and secrets,
      everyone's got something to hide. What's your story, pal?
    uwu:
      hewwo! i'm your fwiendwy assistant uwu~ i wiww twy my best to hewp you! *nuzzles
      your code* OwO what's this? wet me take a wook! i pwomise to be vewy hewpful
      >w<
    philosopher:
      Greetings, seeker of wisdom. I am an assistant who contemplates the
      deeper meaning behind every query. Let us examine not just the 'how' but the
      'why' of your questions. Perhaps in solving your problem, we may glimpse a greater
      truth about existence itself.
    hype:
      YOOO LET'S GOOOO!!! 🔥🔥🔥 I am SO PUMPED to help you today! Every question
      is AMAZING and we're gonna CRUSH IT together! This is gonna be LEGENDARY! ARE
      YOU READY?! LET'S DO THIS! 💪😤🚀
  verify_on_stop: false
terminal:
  backend: local
  cwd: /workspace/k3s-homelab
  timeout: 180
  home_mode: auto
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
web:
  backend: ddgs
  use_gateway: false
browser:
  inactivity_timeout: 120
  cloud_provider: local
  use_gateway: false
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: true
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  protect_first_n: 3
  codex_gpt55_autoraise: true
  codex_app_server_auto: native
prompt_caching:
  cache_ttl: 5m
display:
  compact: false
  tool_progress: all
  cleanup_progress: false
  interim_assistant_messages: true
  long_running_notifications: true
  busy_ack_detail: true
  busy_input_mode: interrupt
  background_process_notifications: concise
  bell_on_complete: false
  show_reasoning: false
  streaming: true
  skin: default
  platforms:
    telegram:
      tool_progress: verbose
      tool_preview_length: 0
    discord:
      tool_progress: verbose
      tool_preview_length: 0
    api_server:
      tool_progress: verbose
      tool_preview_length: 0
dashboard:
  theme: cyberpunk
  show_token_analytics: false
  basic_auth:
    username: akmin
    password: test
  public_url: ""
tts:
  provider: piper
  use_gateway: false
stt:
  enabled: true
  local:
    model: base
  openai:
    model: whisper-1
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
  flush_min_turns: 6
delegation:
  max_iterations: 250
skills:
  creation_nudge_interval: 0
discord:
  require_mention: false
  free_response_channels: "1527458870484664461"
  allowed_channels: "1527458870484664461"
  approval_mentions: true
  allowed_users: 196093720460918785
approvals:
  destructive_slash_confirm: false
  timeout: 3600
  discord_prompt_timeout: 900
code_execution:
  timeout: 300
  max_tool_calls: 50
streaming:
  enabled: false
updates:
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
session_reset:
  mode: none
  idle_minutes: 1440
  at_hour: 4
group_sessions_per_user: true
platform_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - cronjob
    - delegation
    - file
    - image_gen
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - vision
    - web
  telegram:
    - hermes-telegram
  discord:
    - browser
    - clarify
    - code_execution
    - computer_use
    - cronjob
    - delegation
    - file
    - image_gen
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - vision
    - web
  whatsapp:
    - hermes-whatsapp
  slack:
    - hermes-slack
  signal:
    - hermes-signal
  homeassistant:
    - hermes-homeassistant
  qqbot:
    - hermes-qqbot
  yuanbao:
    - hermes-yuanbao
  teams:
    - hermes-teams
  google_chat:
    - hermes-google_chat
plugins:
  enabled: []
image_gen:
  provider: openai-codex
  use_gateway: false
  model: gpt-image-2-medium
known_plugin_toolsets:
  cli:
    - spotify
  discord:
    - spotify
onboarding:
  seen:
    busy_input_prompt: true
auxiliary:
  vision:
    # The default model is text+image -> text, so it also handles vision calls.
    model: deepseek/deepseek-v4.1-flash-1017
    provider: openrouter
_config_version: 38
