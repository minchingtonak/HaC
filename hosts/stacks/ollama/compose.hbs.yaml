services:
  ollama:
    image: ollama/ollama:0.40.14@sha256:ebaef4f4c5d93660e1f25f8ad085a112f51ccfb0e8458073e71793959dba91c9
    container_name: ollama
    restart: unless-stopped
    # ports:
    #   - "11434:11434"          # REST API
    volumes:
      - /docker/ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=1
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.ollama.rule=Host(`{{{domainForApp "ollama"}}}`)
      - traefik.http.routers.ollama.entrypoints=https
      - traefik.http.routers.ollama.tls=true
      - traefik.http.routers.ollama.tls.certresolver=porkbun
      - traefik.http.routers.ollama.service=ollama
      - traefik.http.services.ollama.loadbalancer.server.port=11434
    networks:
      - traefik

networks:
  traefik:
    external: true
