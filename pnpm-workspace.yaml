packages:
  - "libs/*"

# pnpm >= 10.34 matches these entries against the full dependency id, so the
# local file: SDKs must be listed with their spec or their postinstall (which
# compiles bin/index.js) is silently skipped.
allowBuilds:
  "@pulumi/ansible@file:sdks/ansible": true
  "@pulumi/command": true
  "@pulumi/porkbun@file:sdks/porkbun": true
  esbuild: true
  protobufjs: true

patchedDependencies:
  "@pulumi/command": patches/@pulumi__command.patch
